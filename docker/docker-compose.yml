services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sui
      POSTGRES_PASSWORD: sui
      POSTGRES_DB: deepbook_indexer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sui -d deepbook_indexer"]
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: sui
      PGPASSWORD: sui
      PGDATABASE: deepbook_indexer
    volumes:
      - ../migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        for f in /migrations/*.sql; do
          echo "Running migration: $$f";
          psql -f "$$f" || exit 1;
        done;
        echo "All migrations completed successfully";

  api:
    build:
      context: ../api-go
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sui:sui@postgres:5432/deepbook_indexer
      API_LISTEN_ADDR: 0.0.0.0:8080
      LOG_LEVEL: info
    ports:
      - "8080:8080"

  indexer:
    build:
      context: ..
      dockerfile: indexer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sui:sui@postgres:5432/deepbook_indexer
      DEEPBOOK_ENV: testnet
      INDEXER_POLL_INTERVAL_MS: "1000"
      INDEXER_REQUEST_TIMEOUT_MS: "30000"
      INDEXER_BACKOFF_BASE_MS: "100"
      INDEXER_BACKOFF_MAX_MS: "30000"
      RUST_LOG: info
    command: ["run"]

volumes:
  pgdata:
